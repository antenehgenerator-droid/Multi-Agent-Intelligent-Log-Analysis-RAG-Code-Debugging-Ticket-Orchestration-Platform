server:
  port: 8060

spring:
  application:
    name: service-embedding-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/logintel
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual_immediate
    consumer:
      group-id: embedding-worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.platform.*"
        spring.json.value.default.type: "com.platform.queue.model.KafkaEnvelope"

embedding:
  provider: openai
  model-name: text-embedding-3-small
  openai:
    api-key: ${OPENAI_API_KEY:}
  consumer:
    max-poll-records: 32

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
