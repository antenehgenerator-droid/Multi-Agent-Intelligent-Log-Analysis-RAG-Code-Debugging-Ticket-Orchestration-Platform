server:
  port: 8060

spring:
  application:
    name: service-embedding-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/logintel
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      type: batch
      ack-mode: manual_immediate
    consumer:
      group-id: embedding-worker-group
      max-poll-records: 32
      enable-auto-commit: false
      auto-offset-reset: earliest

embedding:
  provider: openai
  model-name: text-embedding-3-small
  openai:
    api-key: ${OPENAI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
